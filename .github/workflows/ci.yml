name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/PcMax.Core.Tests -c Release

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x
      - run: dotnet build PcMax.sln -c Release
      - run: dotnet test tests/PcMax.Core.Tests -c Release --no-build
